<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Eduardo Barros — sites interativos e cibersegurança</title>
  <desc id="d">Uma janela de navegador monta um site, passa por uma varredura de segurança e recebe o selo de protegido.</desc>
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#7dcfff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24283b" stroke-width="1"/>
    </pattern>
    <clipPath id="win"><rect x="720" y="62" width="420" height="214" rx="14"/></clipPath>
    <style>
      .name { font: 800 64px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #c0caf5; letter-spacing: -1px; }
      .role { font: 600 26px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #7aa2f7; }
      .meta { font: 400 19px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #a9b1d6; }
      .url  { font: 500 14px ui-monospace, Menlo, Consolas, monospace; fill: #a9b1d6; }
      .ok   { font: 700 15px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1a1b26; }

      .b1 { animation: in1 8s infinite both; }
      .b2 { animation: in2 8s infinite both; }
      .b3 { animation: in3 8s infinite both; }
      .b4 { animation: in4 8s infinite both; }
      .scan { opacity: 0; animation: scan 8s infinite both; }
      .badge { transform-box: fill-box; transform-origin: center; animation: badge 8s infinite both; }
      .shackle { animation: lock 8s infinite both; }

      @keyframes in1 { 0%, 3% { opacity: 0; transform: translateY(8px); } 9%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @keyframes in2 { 0%, 9% { opacity: 0; transform: translateY(8px); } 15%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @keyframes in3 { 0%, 15% { opacity: 0; transform: translateY(8px); } 21%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @keyframes in4 { 0%, 21% { opacity: 0; transform: translateY(8px); } 27%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      @keyframes scan { 0%, 32% { opacity: 0; transform: translateX(0); } 35% { opacity: 1; } 57% { opacity: 1; } 60%, 100% { opacity: 0; transform: translateX(440px); } }
      @keyframes badge { 0%, 60% { opacity: 0; transform: scale(0.6); } 65% { opacity: 1; transform: scale(1.08); } 69%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
      @keyframes lock { 0%, 60% { transform: translateY(-4px); } 64%, 100% { transform: none; } }

      @media (prefers-reduced-motion: reduce) {
        .b1, .b2, .b3, .b4, .scan, .badge, .shackle { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#1a1b26"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- Identidade -->
  <text x="64" y="138" class="name">Eduardo Barros</text>
  <text x="66" y="184" class="role">Sites interativos e cibersegurança</text>
  <text x="66" y="226" class="meta">Engenharia de Software na Católica de Brasília</text>
  <text x="66" y="254" class="meta">Construo sites que encantam e aprendo a deixá-los seguros.</text>

  <!-- Janela do navegador -->
  <rect x="720" y="62" width="420" height="214" rx="14" fill="#16161e" stroke="#3b4261" stroke-width="1.5"/>
  <g clip-path="url(#win)">
    <rect x="720" y="62" width="420" height="38" fill="#1f2335"/>
    <circle cx="742" cy="81" r="5" fill="#f7768e"/>
    <circle cx="760" cy="81" r="5" fill="#e0af68"/>
    <circle cx="778" cy="81" r="5" fill="#9ece6a"/>
    <rect x="800" y="70" width="320" height="22" rx="11" fill="#16161e"/>
    <!-- cadeado na barra de endereço -->
    <g transform="translate(814 74)">
      <path class="shackle" d="M3 7V5a4 4 0 0 1 8 0v2" fill="none" stroke="#9ece6a" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="1" y="7" width="12" height="8" rx="2" fill="#9ece6a"/>
    </g>
    <text x="834" y="86" class="url">https://seunegocio.com.br</text>

    <!-- site sendo montado -->
    <g class="b1">
      <rect x="744" y="116" width="372" height="56" rx="8" fill="#7aa2f7" opacity="0.9"/>
      <rect x="760" y="132" width="150" height="10" rx="5" fill="#1a1b26" opacity="0.75"/>
      <rect x="760" y="150" width="96" height="8" rx="4" fill="#1a1b26" opacity="0.45"/>
    </g>
    <g class="b2">
      <rect x="744" y="186" width="210" height="9" rx="4.5" fill="#565f89"/>
      <rect x="744" y="203" width="170" height="9" rx="4.5" fill="#414868"/>
    </g>
    <g class="b3">
      <rect x="744" y="226" width="116" height="34" rx="8" fill="#24283b" stroke="#3b4261"/>
      <rect x="872" y="226" width="116" height="34" rx="8" fill="#24283b" stroke="#3b4261"/>
    </g>
    <g class="b4">
      <rect x="1000" y="226" width="116" height="34" rx="17" fill="#bb9af7"/>
      <rect x="1028" y="239" width="60" height="8" rx="4" fill="#1a1b26" opacity="0.6"/>
    </g>

    <!-- varredura de segurança -->
    <rect class="scan" x="680" y="100" width="44" height="176" fill="url(#beam)"/>
  </g>

  <!-- selo de protegido -->
  <g class="badge">
    <rect x="1018" y="258" width="132" height="36" rx="18" fill="#9ece6a"/>
    <path d="M1040 268l7 2.6v5.2c0 4-3 7-7 8.2-4-1.2-7-4.2-7-8.2v-5.2z" fill="#1a1b26"/>
    <path d="M1036.6 276.4l2.4 2.4 4.2-4.6" fill="none" stroke="#9ece6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1056" y="281" class="ok">protegido</text>
  </g>
</svg>
